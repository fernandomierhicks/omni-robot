; The robot's firmware core (lib/omni_fw, unchanged, arm variant) on an Arduino UNO R4 WiFi: a temporary stand-in for
; the Teensy 4.1 with ONE real AK40-10 on CAN (README.md here). The robot computer's mcu_link talks to it as to the
; Teensy (serial, COBS/CRC protocol 8, 2 Mbaud).
;
;   pio run -e uno_r4_wifi                   build (the bench firmware; flash_pi.sh flashes it through the Pi): the
;                                            motor(s) heard on the bus real (any CAN id), the other wheels absent
;                                            (reported DM_NO_REPLY: the console refuses driving)
;   pio run -e virtual                       wheels 2-4 virtual: the drive chain as with four motors (src/main.cpp)
;   pio run -e profile                       + each loop section timed (src/main.cpp, README "Late ticks")

[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_extra_dirs = ../../lib
lib_ldf_mode = deep+
; -DNO_USB off: Serial is the RA4M1's own USB (the core switches the board's USB mux away from the ESP32-S3 bridge),
; like the Teensy's native USB. The bridge's UART corrupted CMDs and hung within seconds at 2 Mbaud and at 921600
; (README.md here). -DBACKTRACE_SUPPORT off too: its crash printer writes to the UART. NO_1200_BPS_RESET: the core's
; own bootloader jump left the board silent and unflashable; src/main.cpp hands the USB back to the bridge instead
build_unflags = -std=gnu++14 -std=gnu++11 -DNO_USB -DBACKTRACE_SUPPORT
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -DFW_PARAMS_HEADER=\"fw_params_arm.h\"
    -DNO_1200_BPS_RESET=1
extra_scripts = pre:build_id.py

; wheels 2-4 virtual (the Nov 12 whole-chain TELEOP run): the core and the console see four motors
[env:virtual]
extends = env:uno_r4_wifi
build_flags = ${env:uno_r4_wifi.build_flags} -DBENCH_VIRTUAL_WHEELS

; the bench firmware with each loop section timed (reported as the virtual wheels' temperatures)
[env:profile]
extends = env:uno_r4_wifi
build_flags = ${env:uno_r4_wifi.build_flags} -DBENCH_VIRTUAL_WHEELS -DBENCH_PROFILE
