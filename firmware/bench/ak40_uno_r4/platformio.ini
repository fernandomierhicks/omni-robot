; AK40-10 CAN bench on an Arduino UNO R4 WiFi, a temporary stand-in for the Teensy 4.1 (README.md here).
; It reuses the robot's servo-mode codec, lib/omni_fw/ak_motor.cpp (src/ak_codec.cpp includes it).
;
;   pio run                 build
;   pio run -t upload       flash (attended sessions only)
;   pio device monitor      type commands by hand (? for help), or drive it with ak_bench.py

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
build_flags = -Wall -Wextra -Wno-unused-parameter -Wl,-u,_printf_float
monitor_speed = 115200
