; omni-robot MCU firmware (design.md 4, 30): Teensy 4.1. The core (lib/omni_fw) is board-free and also runs in the
; sim as the SIL library (sil/build_sil.py); src/main.cpp is the Teensy's hardware layer.
;
;   pio run                 build (checks the pin map: lib/omni_fw/board_teensy41.h static_asserts), prints flash / RAM
;   pio run -t upload       flash (attended sessions only: design.md 5)
;
; Regenerate lib/omni_fw/fw_params.h from the sim with simulation/v11 sil/robot_export.py.

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -DUSB_SERIAL
extra_scripts = pre:fw_build_id.py     ; FW_BUILD: the build id the MCU reports (INFO)
upload_protocol = teensy-cli
monitor_speed = 2000000
