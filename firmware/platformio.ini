; omni-robot MCU firmware (design.md 4, 30): Teensy 4.1. The core (lib/omni_fw) is board-free and also runs in the
; sim as the SIL library (sil/build_sil.py); src/main.cpp is the Teensy's hardware layer.
;
; Variants: env arm (the default) and env catch, below.
;
;   pio run -e catch        build (checks the pin map: lib/omni_fw/board_teensy41.h static_asserts), prints flash / RAM
;   pio run -t upload       flash (attended sessions only: design.md 5)
;
; Regenerate lib/omni_fw/fw_params.h and fw_params_arm.h from the sim with simulation/v11 sil/robot_export.py.

[platformio]
default_envs = arm

[env]
platform = teensy
board = teensy41
framework = arduino
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -DUSB_SERIAL
extra_scripts = pre:fw_build_id.py     ; FW_BUILD: the build id the MCU reports (INFO)
; the BNO085: lib/Adafruit_BNO08x is vendored and patched (its README); these are its own dependencies, the versions
; the wheeled-leg robot's proven driver builds with
lib_deps = adafruit/Adafruit BusIO@1.17.4
           adafruit/Adafruit Unified Sensor@1.1.15
upload_protocol = teensy-cli
monitor_speed = 2000000

; the arm robot (the current build): lib/omni_fw/fw_params_arm.h, CubeMars AK40-10 drives (ak_motor.h, servo mode)
[env:arm]
build_flags = ${env.build_flags} -DFW_PARAMS_HEADER=\"fw_params_arm.h\"

; the arm build on a bare bench Teensy (Nov 13, wheels up, attended): no e-stop chain wired (its input ignored) and no
; battery divider on A17 (a fixed 24.0 V reported, as the UNO R4 bench does). Never on a robot: it can't see its
; e-stop or a flat pack. The firmware core is the arm build's, unchanged
[env:arm_bench]
build_flags = ${env.build_flags} -DFW_PARAMS_HEADER=\"fw_params_arm.h\" -DBENCH_NO_ESTOP -DBENCH_V_BUS=24.0f

; the parked catch robot: lib/omni_fw/fw_params.h (DM-2325 drives). Builds today: use it to check the code compiles
[env:catch]
