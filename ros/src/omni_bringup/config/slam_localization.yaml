# slam_toolbox localization mode (design.md 28), run by localization_slam_toolbox_node on a serialized pose graph.
# Jazzy defaults (mapper_params_localization.yaml) except where noted. map_file_name / map_start_pose come from the launch.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link          # (base_footprint)
    scan_topic: /scan
    mode: localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: true               # (false) map -> odom stamped now: standing still, slam_toolbox processes no scans
                                   # and the scan-stamped transform went stale; Nav2's controller then refused the next
                                   # goal ("Lookup would require extrapolation into the future": 4 of 8 goals)
    min_laser_range: 0.2           # A2M12
    max_laser_range: 12.0          # A2M12
    minimum_time_interval: 0.1     # (0.5) localize on every other scan
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1   # (0.5) correct often: the house tour drives at up to 2 m/s
    minimum_travel_heading: 0.1    # (0.5)
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.55   # (0.45) a false match put the robot 1.8 m off for 14 s (seed 0)

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 1.0        # (3.0) the EKF's own drift stays well inside 1 m here

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
