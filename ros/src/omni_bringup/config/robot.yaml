# The robot's tunable values, one section per node (design.md 2.1). Each is a ROS 2 parameter its node declares with a
# description, a range and whether it is read-only (set at start) or live (changes at once):
#   ros2 param describe /mode_manager pick_timeout      what it is, its range, read-only or not
#   ros2 param set /mode_manager pick_timeout 0.4       live ones only; ROS refuses values out of range
#   ros2 param dump /mode_manager                       to copy tuned values back here
# stack.py loads this file into each node, then its launch-specific values (ports, modes, sim time, the arm's config)
# on top, so those are not here. omni_bringup/test/test_robot_params.py checks every name below is declared by its node.
# Not here: Nav2 / slam_toolbox / EKF (nav2.yaml, slam_*.yaml, ekf.yaml), the console's operator settings (the page's
# Settings: missions.SETTINGS, ~/.omni/console.json), the firmware's limits (compiled in: fw_params*.h, the safety
# ceiling a host can only ask under).

mode_manager:
  ros__parameters:
    rate: 100.0                    # Hz: /mcu/cmd, also the MCU's heartbeat (read-only)
    arm_out_timeout: 0.5           # s: /arm/out older than this counts as arm out (live)
    lock_timeout: 1.0              # s: a true /cmd_vel/lock holds this long (live)
    catch_timeout: 0.3             # s: CATCH without a fresh /catch/cmd -> ramped stop (live)
    thrower_timeout: 0.3           # s: THROWER without a fresh /thrower/cmd -> flywheels down (live)
    pick_timeout: 0.3              # s: PICK without a fresh /pick/cmd_vel -> ramped stop (live)
    wheels_timeout: 0.3            # s: WHEELS (motor test) without a fresh /wheels/cmd -> wheels ramp to rest (live)
    twist_topics: ["/cmd_vel/joy", "/cmd_vel/manual", "/cmd_vel"]    # TELEOP's sources (read-only)
    twist_priorities: [100, 90, 50]                                   # the highest fresh one drives
    twist_timeouts: [0.5, 0.5, 0.5]                                   # s each stays fresh

mcu_link:
  ros__parameters:
    rate: 100.0                    # Hz: CMDs to the MCU (read-only)
    cmd_timeout: 0.3               # s: no /mcu/cmd -> a ramped stop request; under the MCU's own 0.5 s (live)
    edge_latency_us: 0.0           # us: the SYNC pulse's GPIO stamping latency (read-only; VERIFY on the robot)

scan_prep:
  ros__parameters:
    margin: 0.3                    # m: returns this far short of the predicted floor hit are kept (live)
    deskew_keys: 11                # odom poses per scan for the de-skew (live)
    time_order: -1                 # -1: the A2M8 turns clockwise, so /scan's array runs against time (rplidar_node and
                                   # the sim's A2M8; the sim's lidar:=a2m12 runs with it: stack.py sets 1) (read-only)
    refine_stamps: false           # re-time scans from their spacing: for sllidar-style stamps only (read-only)
    latency: 0.0                   # s: the lidar's stamp latency with refine_stamps (read-only)

rplidar:                           # omni_cpp rplidar_node: the A2M8, stamped from its sample clock (design.md 4.6)
  ros__parameters:
    mode: Stability                # the device's typical: 4 k samples/s (read-only)
    pwm: 660                       # the motor: 12.5 Hz warm, open loop (live)
    bins: 320                      # about the turn's samples at pwm 660 (320-340): few empty bins. slam_toolbox scores a
                                   # match over all bins, empty ones too, so empty bins lower every score against its
                                   # loop-closure thresholds; 720 bins mapped worse (sim, Nov 17, design.md 4.6; the
                                   # sim's A2M8 bins as this) (read-only)
    latency: 0.0005                # s: a packet's fastest delivery beyond its transmission (est; omni_calib) (live)

heading_node:
  ros__parameters:
    rate: 50.0                     # Hz (read-only)
    spin_rate: 2.0943951           # rad/s (120 deg/s): spinning's turn rate; the console's Go To sets it (live)
    turn_max: 1.5707963            # rad/s (90 deg/s): forward's top turn rate (live)
    lead: 0.03                     # s from the shaper to the firmware acting (live)

arm_driver:
  ros__parameters:
    tf_hz: 0.0                     # Hz: the arm's TF, 0 = every cycle (read-only)
    arm_torque: 1000               # the arm joints' torque limit, 0.1 % of stall, at each torque-on (live)
    grip_torque: 500               # the gripper's (est; LeRobot's SO-101 follower uses ~50 %) (live)
    bus_timeout: 0.02              # s: the wait for each servo's reply (read-only)
    retry_s: 2.0                   # s between attempts to open the bus (live)
    # design.md 4.5: the servo settings written at connect where a servo differs (EEPROM; est, LeRobot's follower)
    servo_write_settings: true
    servo_p_gain: 16               # the position P (factory 32 jitters on the gearbox's play)
    servo_d_gain: 32
    servo_max_temp: 65             # C: a servo unloads past this (factory 70)
    servo_protect_current: 500     # 6.5 mA: 3.25 A for the arm joints
    servo_grip_protect_current: 250
    servo_overload_torque: 80      # %: held this long (protection time) it drops to the protective torque
    servo_grip_overload_torque: 25
    # the strain detector and its reflex (design.md 4.5): thresholds come from the arm load calibration
    strain_tau: 0.04               # s: the outside torque's low-pass (read-only)
    strain_cycles: 4               # cycles over the threshold in a row (read-only)
    reflex: true                   # a strained joint stops a guarded motion and gives (live)
    reflex_nominal: false          # ... on the nominal model too, before the arm load calibration (live)
    reflex_backoff: 0.05           # rad (live)
    reflex_soft_torque: 350        # 0.1 %: the strained joints' torque limit until the next command (live)
    hold_trim: true                # holding still: nudge the goals until the encoders read them (the droop) (live)
    hold_trim_rate: 3.0            # 1/s (live)
    hold_trim_max: 0.07            # rad (live)
    deflect: true                  # settled, a joint pushed off its goal is strained (live)
    deflect_angle: 0.012           # rad (~0.7 deg) (live)
    deflect_settle: 1.0            # s after a motion: the trim settles the droop, then the cue watches (live)

arm_node:                          # omni_arm's arm_brain
  ros__parameters:
    health_grace: 0.5              # s of unhealthy servo feedback a tidy rides through (live)
    hw_stale: 2.0                  # s without /arm/hw: the driver isn't running (live)

catch_perception:
  ros__parameters:
    calib_rot_deg: 0.1             # deg: the stereo calibration's rotation uncertainty (read-only)
    ball_size_rel: 0.015           # the ball's apparent-size noise, relative (read-only)

floor_obstacles:                   # omni_arm (depth_layer:=floor)
  ros__parameters:
    rate: 5.0                      # Hz: depth frames used at most (live)
    stride: 1                      # every n-th depth pixel: CPU against detail (live)
    forget_radius: 0.5             # m: marks this near the robot forgotten after a pick (live)
    publish_rate: 2.0              # Hz: the grid to Nav2 at most (live)

ball_track:                        # omni_arm: the Goalie's ball (asleep until the console's Goalie plays)
  ros__parameters:
    color: red                     # the ball's colour (read-only)
    diameter_m: 0.22               # m: a play ball (est; set it to the ball you use) (live)
    min_pixels: 40                 # fewer ball-coloured pixels with depth: not seen (live)
    max_range_m: 4.5               # m (live)
    stride: 2                      # every n-th pixel: CPU against range (live)

height_map:                        # omni_arm (depth_layer:=height)
  ros__parameters:
    rate: 5.0                      # Hz (live)
    stride: 1                      # (live)
    forget_radius: 0.5             # m (live)
    publish_rate: 2.0              # Hz (live)

tag_slam:                          # omni_slam
  ros__parameters:
    lidar_sigma_m: 0.03            # m: a lidar pose fix's position sigma (live)
    lidar_sigma_deg: 1.0           # deg: its heading sigma (live)
    refine_camera_deg: 0.5         # deg: the camera mount prior for online refinement, 0 = off (read-only)
    tag_size: 0.16                 # m: the tags' black square (read-only)
    dock_tag_id: -1                # the dock's tag id, -1 = none (read-only)

tag_detector:                      # omni_slam (on the robot; the sim's bridge detects its own)
  ros__parameters:
    rate: 10.0                     # Hz: frames searched at most (live)
    tag_size: 0.16                 # m (read-only)
    decimate: 2.0                  # quad search on a 2x smaller picture: ~3x faster on the Pi 4 (live)
    threads: 2                     # the C apriltag detector's threads (read-only)

omni_face:
  ros__parameters:
    facing_deg: 0.0                # deg: which way the face looks on the body (read-only)

image_preview:                     # omni_perception: the console's camera previews
  ros__parameters:
    rate: 5.0                      # Hz per camera at most (live)
    width: 320                     # px (live)
    quality: 60                    # JPEG quality (live)

people:                            # omni_perception: people from the lidar and the forward camera (design.md 4.12)
  ros__parameters:
    model: yolox_nano              # the person detector (read-only): yolox_tiny | yolox_s (design.md 4.12)
    threads: 2                     # onnxruntime threads (read-only)
    rate: 5.0                      # Hz: camera frames searched at most (live)
    min_score: 0.35                # a person box's least score (live)
    floating_score: 0.5            # ... of a box with no feet on the floor in view: behind furniture, or a sign (live)
