# AMCL on maps/<map>.yaml (localizer:=amcl, design.md 4.9): the alternative to slam_toolbox's localization, a particle
# filter on the occupancy grid. Jazzy defaults (nav2_bringup nav2_params.yaml) except where noted. yaml_filename and
# the scan topic come from the launch.
amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::OmniMotionModel"   # (Differential) the omni base slides sideways
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link       # (base_footprint)
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: map
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.2           # (-1) A2M12
    laser_max_range: 12.0          # (100) A2M12
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2              # (0.2) as slam_toolbox's lean profile: every 0.2 m / 0.2 rad
    update_min_d: 0.2              # (0.25)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    set_initial_pose: true         # (false) the robot starts where the map's session started, as map_start_pose
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl"]
